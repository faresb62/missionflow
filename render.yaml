services:
  - type: web
    name: missionflow-api
    runtime: node
    region: frankfurt
    plan: free
    healthCheckPath: /health
    buildCommand: dotnet restore src/backend/MissionFlow.Api/MissionFlow.Api.csproj && dotnet publish src/backend/MissionFlow.Api/MissionFlow.Api.csproj -c Release -o out
    startCommand: dotnet out/MissionFlow.Api.dll
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: missionflow-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: missionflow-api.onrender.com
      - key: Jwt__Audience
        value: missionflow-api.onrender.com
      - key: Jwt__ExpirationMinutes
        value: "1440"
      - key: Cors__Origins
        value: "http://localhost:5173"

databases:
  - name: missionflow-db
    databaseName: missionflow
    plan: free
    region: frankfurt
    ipAllowList: []
